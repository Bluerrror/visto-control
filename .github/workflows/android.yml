name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/visto-control-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: visto-sms-debug-apk
          path: out/visto-control-debug.apk
          if-no-files-found: error

      - name: Publish APK to Release (direct download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: آخرین نسخهٔ APK — کنترل ویستو
          body: |
            فایل نصبی اندروید «کنترل ویستو». روی گوشی دانلود و نصب کنید
            (نصب از منابع ناشناس را فعال کنید). این نسخه با کلید debug امضا شده است.
          files: out/visto-control-debug.apk
